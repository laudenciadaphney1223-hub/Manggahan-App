<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manggahan Site Performance</title>
<meta name="theme-color" content="#0086bf">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Manggahan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html,body{margin:0;height:100%;background:#eef5f9;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
  #app{border:0;width:100%;height:100%;display:block}
  #splash{position:fixed;inset:0;display:grid;place-items:center;background:#eef5f9;transition:opacity .3s}
  #splash div{display:flex;flex-direction:column;align-items:center;gap:12px;color:#45555e;font-size:14px}
  #splash img{width:96px;height:96px;border-radius:20px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
  #splash.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="splash"><div><img src="icon-192.png" alt="Jentec Storage Inc."><span>Loading Manggahan Site Performance…</span></div></div>
<iframe id="app" title="Manggahan Site Performance" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
<script>
  // ▼▼ Paste your Apps Script Web app URL (ends in /exec) between the quotes ▼▼
  const APP_URL = "https://script.google.com/macros/s/AKfycbw820-ZuV9tLrDgYfYg-J54hJxF9tVHjy8HEPrtIRA5H90DId68VAn_S7ktQjAd9v6i/exec;
  const f = document.getElementById("app");
  if (APP_URL.startsWith("https://script.google.com/")) { f.src = APP_URL; }
  else { document.querySelector("#splash span").textContent = "Set APP_URL in index.html to your Apps Script web app URL."; }
  f.addEventListener("load", () => setTimeout(() => document.getElementById("splash").classList.add("hide"), 300));
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
